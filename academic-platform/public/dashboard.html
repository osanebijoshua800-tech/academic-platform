<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Platform - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Header / Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold gradient-text">Academic Dashboard</h1>
            <div class="flex items-center gap-4">
                <a href="analytics.html"
                    class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-slate-700">
                    📊 My Analytics
                </a>
                <span id="user-display" class="text-sm font-semibold text-slate-300"></span>
                <button id="logout-btn"
                    class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 px-4 py-2 rounded-xl text-sm font-semibold transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-10 space-y-8">
        <div class="glass-dark p-8 rounded-3xl border border-slate-800 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6">Available Courses</h2>
            <div id="courses-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-slate-400 py-4">Loading courses...</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
